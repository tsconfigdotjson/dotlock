name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build:helpers

      - name: Write Apple API key file
        run: |
          mkdir -p ~/.appstoreconnect
          echo "${{ secrets.ELECTROBUN_APPLEAPIKEYCONTENTS }}" > ~/.appstoreconnect/AuthKey.p8

      - name: Build stable release
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
          ELECTROBUN_APPLEAPIKEYPATH: ~/.appstoreconnect/AuthKey.p8
          ELECTROBUN_APPLEAPIKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          ELECTROBUN_APPLEAPIISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
        run: bun run build:stable

      - name: Upload to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bun scripts/uploadArtifacts.ts

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/
